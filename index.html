<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Address Management</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="address-management-container">
        <div class="address-management-header">
            <h1>Address Management</h1>
            <button class="add-address-btn">Add Address</button>
        </div>
        
        <div class="address-management-tabs">
            <div class="tab active">Shipping</div>
            <div class="tab">Billing</div>
        </div>
        <div class="address-cards">
            <div class="address-card active">
                <p class="default"> Default </p>
                <div class="address-content">
                    <h3>Jane Doe</h3>
                    <p>123 Broadway</p>
                    <p>New York, 11000</p>
                    <p>US</p>
                </div>
                <div class="address-actions">
                    <button class="edit-btn">Edit</button>
                    <button class="delete-btn">Delete</button>
                </div>
            </div> 
            <div class="address-card">
                <p class="default"> Default </p>
                <div class="address-content">
                    <h3>Jane Doe</h3>
                    <p>123 Broadway</p>
                    <p>New York, 11000</p>
                    <p>US</p>
                </div>
                <div class="address-actions">
                    <button class="edit-btn">Edit</button>
                    <button class="delete-btn">Delete</button>
                </div>
            </div> 
        </div>
    </div>
</body>
</html>
